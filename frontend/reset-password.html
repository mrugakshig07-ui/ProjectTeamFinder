<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New password · ProjectFinder</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-intro" aria-hidden="true"><a class="brand" href="/index.html"><span class="brand-mark">✦</span> ProjectFinder</a><div class="intro-copy"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password.</h1><p>Make it unique and keep your account secure.</p></div><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div></section><section class="auth-panel"><div class="auth-heading"><span class="eyebrow">NEW PASSWORD</span><h2>Set your password</h2><p>This secure link works once and will expire automatically.</p></div><form id="form" class="auth-form"><label for="password">New password</label><div class="password-field"><input id="password" type="password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><label for="confirm">Confirm new password</label><div class="password-field"><input id="confirm" type="password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="confirm" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><button type="submit" class="primary-button auth-button">Update password <span>→</span></button></form><div id="message" class="profile-message" role="status"></div></section></main>
<script>
    document.querySelectorAll('[data-password-toggle]').forEach((button) => button.addEventListener('click', () => { const input = document.getElementById(button.dataset.passwordToggle); const visible = input.type === 'text'; input.type = visible ? 'password' : 'text'; }));

    function showMessage(el, text, type) { el.textContent = text; el.classList.remove('is-visible', 'is-error', 'is-success'); void el.offsetWidth; el.classList.add('is-visible', type === 'error' ? 'is-error' : 'is-success'); }
    async function postJSON(url, body) {
        let response;
        try { response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
        catch (err) { throw new Error("Can't reach the server. Make sure it's running and check your connection."); }
        try { return await response.json(); }
        catch (err) { throw new Error('Server sent an unexpected response. Please try again.'); }
    }

    const q = new URLSearchParams(location.hash.slice(1)), accessToken = q.get('access_token'), refreshToken = q.get('refresh_token');
    const form = document.getElementById('form'), message = document.getElementById('message'), button = form.querySelector('button[type="submit"]');
    // Grabbed explicitly by id: an <input id="confirm"> collides with the built-in
    // window.confirm() dialog function, so a bare `confirm` reference would silently
    // resolve to that function instead of the input, breaking `.value`.
    const passwordField = document.getElementById('password'), confirmField = document.getElementById('confirm');
    if (!accessToken || !refreshToken) showMessage(message, 'This reset link is missing or has already been used. Request a new one from the sign-in page.', 'error');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (passwordField.value !== confirmField.value) return showMessage(message, 'Passwords do not match.', 'error');
        if (!accessToken || !refreshToken) return showMessage(message, 'This reset link is invalid or expired. Request a new one.', 'error');
        showMessage(message, 'Updating password…', 'neutral');
        button.disabled = true; button.dataset.loading = 'true';
        try {
            const data = await postJSON('/api/set-password', { accessToken, refreshToken, password: passwordField.value });
            showMessage(message, data.message, data.success ? 'success' : 'error');
            if (data.success) setTimeout(() => location.href = '/login.html', 900);
            else { button.disabled = false; button.dataset.loading = 'false'; }
        } catch (error) { showMessage(message, error.message, 'error'); button.disabled = false; button.dataset.loading = 'false'; }
    });
</script>
</body></html>
