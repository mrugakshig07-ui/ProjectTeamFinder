<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · ProjectFinder</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-intro" aria-hidden="true"><a class="brand" href="/index.html"><span class="brand-mark">✦</span> ProjectFinder</a><div class="intro-copy"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>We'll get you back to building.</h1><p>Enter your email and we'll send a secure password-reset link.</p></div><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div></section><section class="auth-panel"><a href="/login.html" class="back-link">← Back to sign in</a><div class="auth-heading"><span class="eyebrow">RESET PASSWORD</span><h2>Forgot your password?</h2><p>We'll email you a link to create a new one.</p></div><form id="forgotForm" class="auth-form"><label for="email">Email address</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com" required><button type="submit" class="primary-button auth-button">Send reset link <span>→</span></button></form><div id="message" class="profile-message" role="status"></div><p class="auth-footer">Remembered it after all? <a href="/login.html">Sign in</a></p></section></main>
<script>
    function showMessage(el, text, type) { el.textContent = text; el.classList.remove('is-visible', 'is-error', 'is-success'); void el.offsetWidth; el.classList.add('is-visible', type === 'error' ? 'is-error' : 'is-success'); }
    async function postJSON(url, body) {
        let response;
        try { response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
        catch (err) { throw new Error("Can't reach the server. Make sure it's running and check your connection."); }
        try { return await response.json(); }
        catch (err) { throw new Error('Server sent an unexpected response. Please try again.'); }
    }
    const form = document.getElementById('forgotForm'), message = document.getElementById('message'), button = form.querySelector('button[type="submit"]');
    const emailField = document.getElementById('email');
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage(message, 'Sending reset link…', 'neutral');
        button.disabled = true; button.dataset.loading = 'true';
        try {
            const data = await postJSON('/api/forgot-password', { email: emailField.value.trim() });
            showMessage(message, data.message || 'Check your email for a reset link.', data.success ? 'success' : 'error');
        } catch (error) { showMessage(message, error.message, 'error'); }
        finally { button.disabled = false; button.dataset.loading = 'false'; }
    });
</script>
</body></html>
