<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · ProjectFinder</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><nav class="navbar"><div class="logo">ProjectFinder</div><div class="nav-links"><a class="nav-primary" href="projects.html">Projects</a><a class="nav-primary" href="members.html">Members</a><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button></div></nav><main class="identity-container"><div id="message" class="profile-message"></div><header class="identity-header"><div class="avatar-xl" id="avatar">👤</div><div class="identity-meta"><div class="identity-name-row"><h1 id="name">Loading…</h1><span class="public-id-chip" id="publicId"></span></div><div class="identity-username" id="username"></div><div class="role-title-text" id="role"></div><p class="identity-bio" id="bio"></p><div class="identity-skills" id="skills"></div><div class="identity-social" id="social"></div><div class="identity-actions"><button class="follow-button" id="follow" hidden><span class="follow-label">Follow</span></button><button class="primary-button" id="connect" hidden>Connect</button><a class="app-gradient-button" id="messageLink" hidden>Message</a></div></div></header><section class="profile-stats"><div><strong id="followers">—</strong><span>Followers</span></div><div><strong id="following">—</strong><span>Following</span></div></section></main><script>
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('user'),esc=v=>{let d=document.createElement('div');d.textContent=v||'';return d.innerHTML};let following=false;async function api(url,o){let r=await fetch(url,o),d=await r.json();if(!d.success)throw Error(d.message||'Request failed.');return d}function photo(p){return p?`<img src="${esc(p)}" alt="Profile photo">`:'👤'}function button(){let b=$('follow');b.hidden=false;b.classList.toggle('is-following',following);b.querySelector('span').textContent=following?'Following':'Follow'}function renderConnect(connection,canReceive){let b=$('connect');
// The Connect button reflects the real relationship: none, pending either
// way, or already connected.
if(connection&&connection.status==='accepted'){b.hidden=false;b.disabled=true;b.className='secondary-button';b.textContent='Connected';let m=$('messageLink');m.hidden=false;m.href='messages.html?start='+encodeURIComponent(id);return}
if(connection&&connection.status==='pending'){b.hidden=false;b.disabled=true;b.className='secondary-button';b.textContent=connection.direction==='sent'?'Request sent':'Respond in Connections';return}
if(!canReceive){b.hidden=true;return}
b.hidden=false;b.disabled=false;b.className='primary-button';b.textContent='Connect';
b.onclick=async()=>{b.disabled=true;try{await api('/api/profiles/'+encodeURIComponent(id)+'/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});b.textContent='Request sent';b.className='secondary-button'}catch(e){$('message').textContent=e.message;$('message').className='profile-message is-visible is-error';b.disabled=false}}}
async function load(){if(!id)return location.href='profile.html';try{let d=await api('/api/profiles/'+encodeURIComponent(id)),p=d.profile;$('name').textContent=p.name;$('publicId').textContent=p.public_id;$('username').textContent='@'+p.username;$('role').textContent=p.role_title||'';$('bio').textContent=p.bio||'';$('avatar').innerHTML=photo(p.photo);$('followers').textContent=d.stats.followers;$('following').textContent=d.stats.following;$('skills').innerHTML=(p.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');$('social').innerHTML=[['LinkedIn',p.linkedin],['GitHub',p.github],['Portfolio',p.portfolio],['Website',p.other_website]].filter(x=>x[1]).map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join('');if(d.is_owner)return location.href='profile.html';following=d.is_following;button();renderConnect(d.connection,d.can_receive_connection)}catch(e){$('message').textContent=e.message;$('message').className='profile-message is-visible is-error'}}$('follow').onclick=async()=>{let b=$('follow');b.disabled=true;try{let d=await api('/api/profiles/'+encodeURIComponent(id)+'/follow',{method:following?'DELETE':'POST'});following=!following;$('followers').textContent=d.stats.followers;button()}catch(e){$('message').textContent=e.message;$('message').className='profile-message is-visible is-error'}finally{b.disabled=false}};if($('logout'))$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='index.html'};load();
</script></body></html>
